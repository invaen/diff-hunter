[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-hunter"
version = "1.1.0"
description = "Catch new attack surface before anyone else"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "invaen"}]
keywords = ["security", "monitoring", "bug-bounty", "reconnaissance", "attack-surface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
diff-hunter = "diff_hunter:main"

[project.urls]
Homepage = "https://github.com/invaen/diff-hunter"
Issues = "https://github.com/invaen/diff-hunter/issues"
